[package]
name = "webapp-base"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "backend"
path = "backend/main.rs"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
axum_csrf = "0.11.0"
axum_session = "0.21.0"
axum_session_sqlx = { version = "=0.11.0", default-features = false, features = [
  "sqlite",
  "tls-rustls",
] }
dotenvy = "0.15.7"
oauth2 = "5.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
rust-embed = { version = "8.12.0", features = ["axum"] }
