{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="flex justify-center items-center h-[80vh]">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title justify-center">Welcome</h2>
      <form hx-post="/login" class="form-control gap-4">
        <input type="email" name="email" placeholder="Email" class="input input-bordered w-full" />
        <button class="btn btn-primary w-full">Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
